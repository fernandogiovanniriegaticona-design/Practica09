<div class="home-container">
  <mat-card class="filter-card">
    <mat-card-header>
      <mat-card-title>Catálogo de Biblioteca Universitaria</mat-card-title>
      <mat-card-subtitle>Facultad de Ingeniería de Producción y Servicios - UNSA</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Filtrar por Categoría</mat-label>
        <mat-select [(ngModel)]="categoriaSeleccionada" (selectionChange)="filtrarLibros()">
          <mat-option *ngFor="let cat of categorias" [value]="cat">
            {{ cat }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </mat-card-content>
  </mat-card>

  <app-tabla-libros [libros]="libros"></app-tabla-libros>
</div>
